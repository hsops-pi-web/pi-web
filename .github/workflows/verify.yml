name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify
